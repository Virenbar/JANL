name: Publish Artifact
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  build:
    name: Build
    uses: ./.github/workflows/build-artifact.yml

  publish:
    name: Publish
    runs-on: windows-latest
    needs: build
    steps:
      - name: Install .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 6.x

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: JANL

      - name: List files
        run: ls -R

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: Virenbar

      - name: Push - NuGet
        run: dotnet nuget push **\*.nupkg -s 'https://api.nuget.org/v3/index.json' -k ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate

      - name: Push - GitHub
        run: dotnet nuget push **\*.nupkg -s 'https://nuget.pkg.github.com/Virenbar/index.json' -k ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
